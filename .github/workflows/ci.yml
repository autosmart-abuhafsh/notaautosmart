name: Autosmart Invoice CI & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Typecheck
        run: npm run lint

      - name: Run Business Logic Unit Tests
        run: npx --yes tsx --test src/utils/invoiceLogic.test.ts

      - name: Build Production Bundle (Vite)
        run: npm run build
